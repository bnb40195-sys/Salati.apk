name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release with downloadable APK'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (default: v1.0-debug)'
        required: false
        type: string
        default: 'v1.0-debug'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -e
          set +o pipefail

          CANDIDATE_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -n "$CANDIDATE_SDK" ] && [ -d "$CANDIDATE_SDK" ] && \
             mkdir -p "$CANDIDATE_SDK/licenses" 2>/dev/null && \
             touch "$CANDIDATE_SDK/licenses/.write_test" 2>/dev/null; then
            rm -f "$CANDIDATE_SDK/licenses/.write_test"
            SDK_DIR="$CANDIDATE_SDK"
          else
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR/licenses"
          fi

          echo "Using Android SDK directory: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              if "$candidate" --sdk_root="$SDK_DIR" --version >/dev/null 2>&1; then
                SDKMANAGER="$candidate"
                break
              fi
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Working sdkmanager not found. Downloading Android Command-line Tools..."
            TMP_DIR=$(mktemp -d)
            CMDLINE_ZIP=$(curl -fsSL --retry 3 https://dl.google.com/android/repository/repository2-1.xml \
              | grep -oE 'commandlinetools-linux-[0-9]+_latest\.zip' \
              | head -n 1 || true)
            if [ -n "$CMDLINE_ZIP" ]; then
              DOWNLOAD_URL="https://dl.google.com/android/repository/${CMDLINE_ZIP}"
            else
              DOWNLOAD_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            fi
            echo "Downloading $DOWNLOAD_URL"
            curl -fSL --retry 3 --retry-delay 5 "$DOWNLOAD_URL" -o "$TMP_DIR/cmdline-tools.zip"
            unzip -q "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR/extract"
            mkdir -p "$SDK_DIR/cmdline-tools"
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv "$TMP_DIR/extract/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -rf "$TMP_DIR"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$SDK_DIR/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf '%s\n' '33b6a2b64607f11b759f320ef9dff4ae5c47d97a' > "$SDK_DIR/licenses/google-gdk-license"
          printf '%s\n' '859f317696f67ef3d7f050a5560e7834b43903' > "$SDK_DIR/licenses/android-sdk-arm-dbt-license"
          printf '%s\n' '601085b94cd77f0b54ff86406957099ebe79c4d6' > "$SDK_DIR/licenses/android-googletv-license"
          printf '%s\n' 'ceff83576aac4f7f37cb98fe189e9fb3c49d3b81' > "$SDK_DIR/licenses/android-googlexr-license"

          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK platforms & build-tools..."
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1" || {
              echo "Combined install failed; retrying packages individually..."
              "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" || true
              "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "build-tools;36.0.0"
              "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-36" || true
              "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-36.1"
            }

          echo "Installed platforms:"
          ls -1 "$SDK_DIR/platforms" 2>/dev/null || true
          echo "Installed build-tools:"
          ls -1 "$SDK_DIR/build-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          echo "Setting up debug signing keystore..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests & Build Debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Align, Sign (V1+V2+V3) & Prepare APK Assets for Download
        id: prepare_apk
        shell: bash
        run: |
          set -e
          set +o pipefail

          mkdir -p release_assets
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -type f -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK file not found in app/build/outputs/apk/debug!"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=""
          for dir in $(ls -d "$SDK_DIR/build-tools"/* 2>/dev/null | sort -Vr); do
            if [ -x "$dir/zipalign" ] && [ -x "$dir/apksigner" ]; then
              BUILD_TOOLS_DIR="$dir"
              break
            fi
          done
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "Error: Android build-tools (zipalign/apksigner) not found in $SDK_DIR/build-tools!"
            exit 1
          fi

          DATE_STR=$(date +'%Y%m%d')
          ALIGNED_APK="release_assets/aligned-debug.apk"
          OUTPUT_APK="release_assets/Salati-PrayerTimes-Debug.apk"
          VERSIONED_APK="release_assets/Salati-v1.0-${DATE_STR}-debug.apk"

          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$APK_PATH" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            "$ALIGNED_APK"
          rm -f "$ALIGNED_APK" "$OUTPUT_APK.idsig"

          "$BUILD_TOOLS_DIR/apksigner" verify --min-sdk-version 21 --verbose "$OUTPUT_APK"
          cp "$OUTPUT_APK" "$VERSIONED_APK"

          (
            cd release_assets
            sha256sum Salati-PrayerTimes-Debug.apk > checksums.txt
            sha256sum "$(basename "$VERSIONED_APK")" >> checksums.txt
          )

          echo "APK generated & verified successfully: $OUTPUT_APK ($(du -h "$OUTPUT_APK" | cut -f1))"
          echo "apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          echo "versioned_apk=$VERSIONED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Salati-Debug-APK
          path: |
            release_assets/*.apk
            release_assets/checksums.txt
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        if: github.event_name != 'pull_request'
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_RELEASE_TAG" ]; then
            TAG="$INPUT_RELEASE_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0-debug"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "صلاتي - Salati Android App (${{ steps.release_info.outputs.tag }})"
          body: |
            ### 🕌 صلاتي • تطبيق مواقيت الصلاة والأذكار والقرآن والسنة

            تم بناء ملف الـ **Debug APK** تلقائياً عبر GitHub Actions وهو جاهز للتحميل المباشر والتثبيت على هواتف أندرويد.

            #### 📥 رابط التحميل المباشر (Direct APK Download):
            * **[تحميل تطبيق صلاتي — Salati-PrayerTimes-Debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/Salati-PrayerTimes-Debug.apk)**
            * رابط أحدث إصدار دائماً: `https://github.com/${{ github.repository }}/releases/latest/download/Salati-PrayerTimes-Debug.apk`

            ---
            #### 📱 أبرز المميزات:
            - **مواقيت الصلاة الدقيقة**: تحديد تلقائي حقيقي للموقع عبر GPS وعرض المدينة المكتشفة مع خوارزميات فلكية دقيقة.
            - **القرآن والسنة**: تصفح المصحف الشريف باختيار الرواية (حفص عن عاصم وغيرها) مع تكبير وتصغير النص وحفظ الموضع والتلاوات الصوتية.
            - **بوصلة القبلة والتقويم الهجري والمسبحة الإلكترونية**.
            - **ويدجت مواقيت الصلاة** للشاشة الرئيسية مع دعم التوقيت 12/24 ساعة.
            - **بوابة الحساب**: تسجيل الدخول وإنشاء الحساب قبل دخول التطبيق.

            #### ⚙️ طريقة التثبيت على الهاتف:
            1. حمّل ملف `Salati-PrayerTimes-Debug.apk` مباشرة إلى هاتفك.
            2. افتح الملف واضغط على **تثبيت (Install)**.
            3. إذا طُلب منك تفعيل تثبيت التطبيقات من مصادر غير معروفة (Install unknown apps)، اسمح بذلك ثم تابع التثبيت.

            **بصمة التحقق (SHA-256):** راجع ملف `checksums.txt` المرفق للتحقق من سلامة الملف.
          files: |
            release_assets/Salati-PrayerTimes-Debug.apk
            release_assets/checksums.txt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
