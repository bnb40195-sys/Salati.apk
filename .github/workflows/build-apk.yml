name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release with downloadable APK'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (default: v1.0-debug)'
        required: false
        type: string
        default: 'v1.0-debug'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR/licenses"
            SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            fi
          fi

      - name: Prepare Keystore and Environment
        run: |
          echo "Setting up debug signing keystore..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests & Build Debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Align, Sign (V1+V2+V3) & Prepare APK Assets for Download
        id: prepare_apk
        run: |
          mkdir -p release_assets
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -type f -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK file not found in app/build/outputs/apk/debug!"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_DIR/build-tools"/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "Error: Android build-tools not found!"
            exit 1
          fi

          DATE_STR=$(date +'%Y%m%d')
          ALIGNED_APK="release_assets/aligned-debug.apk"
          OUTPUT_APK="release_assets/Salati-PrayerTimes-Debug.apk"
          VERSIONED_APK="release_assets/Salati-v1.0-${DATE_STR}-debug.apk"

          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$APK_PATH" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            "$ALIGNED_APK"
          rm -f "$ALIGNED_APK" "$OUTPUT_APK.idsig"

          "$BUILD_TOOLS_DIR/apksigner" verify --min-sdk-version 21 --verbose "$OUTPUT_APK"
          cp "$OUTPUT_APK" "$VERSIONED_APK"

          (
            cd release_assets
            sha256sum Salati-PrayerTimes-Debug.apk > checksums.txt
            sha256sum "$(basename "$VERSIONED_APK")" >> checksums.txt
          )

          echo "APK generated & verified successfully: $OUTPUT_APK ($(du -h "$OUTPUT_APK" | cut -f1))"
          echo "apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          echo "versioned_apk=$VERSIONED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Salati-Debug-APK
          path: |
            release_assets/*.apk
            release_assets/checksums.txt
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        if: github.event_name != 'pull_request'
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_RELEASE_TAG" ]; then
            TAG="$INPUT_RELEASE_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0-debug"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "صلاتي - Salati Android App (${{ steps.release_info.outputs.tag }})"
          body: |
            ### 🕌 صلاتي • تطبيق مواقيت الصلاة والأذكار والقرآن والسنة

            تم بناء ملف الـ **Debug APK** تلقائياً عبر GitHub Actions وهو جاهز للتحميل المباشر والتثبيت على هواتف أندرويد.

            #### 📥 رابط التحميل المباشر (Direct APK Download):
            * **[تحميل تطبيق صلاتي — Salati-PrayerTimes-Debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/Salati-PrayerTimes-Debug.apk)**
            * رابط أحدث إصدار دائماً: `https://github.com/${{ github.repository }}/releases/latest/download/Salati-PrayerTimes-Debug.apk`

            ---
            #### 📱 أبرز المميزات:
            - **مواقيت الصلاة الدقيقة**: تحديد تلقائي حقيقي للموقع عبر GPS وعرض المدينة المكتشفة مع خوارزميات فلكية دقيقة.
            - **القرآن والسنة**: تصفح المصحف الشريف باختيار الرواية (حفص عن عاصم وغيرها) مع تكبير وتصغير النص وحفظ الموضع والتلاوات الصوتية.
            - **بوصلة القبلة والتقويم الهجري والمسبحة الإلكترونية**.
            - **ويدجت مواقيت الصلاة** للشاشة الرئيسية مع دعم التوقيت 12/24 ساعة.
            - **بوابة الحساب**: تسجيل الدخول وإنشاء الحساب قبل دخول التطبيق.

            #### ⚙️ طريقة التثبيت على الهاتف:
            1. حمّل ملف `Salati-PrayerTimes-Debug.apk` مباشرة إلى هاتفك.
            2. افتح الملف واضغط على **تثبيت (Install)**.
            3. إذا طُلب منك تفعيل تثبيت التطبيقات من مصادر غير معروفة (Install unknown apps)، اسمح بذلك ثم تابع التثبيت.

            **بصمة التحقق (SHA-256):** راجع ملف `checksums.txt` المرفق للتحقق من سلامة الملف.
          files: |
            release_assets/Salati-PrayerTimes-Debug.apk
            release_assets/checksums.txt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
